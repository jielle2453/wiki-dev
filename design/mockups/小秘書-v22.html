<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>小秘書 v22</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@600;700&display=swap">
<style>
/* 一人用的手機頁，黑白灰：淺灰底、白卡片加淡陰影、沒有框線；黑色只用在小地方（選到的日期、勾、主要按鈕），最先要做的那件是淺灰框卡。
   紅色只給逾期。今天＝一週直條＋三個數字＋「完成了嗎？」＋時間軸；甘特圖、月曆照舊。所有寫入都是 Drive 新增變動檔。 */
:root{
  --bg:#F3F3F1; --surface:#FFFFFF; --surface-2:#F2F2F0; --weekend:#F8F8F6; --band:#EAEAE6;
  --ink:#141414; --muted:#8A8A8A; --muted-2:#BDBDBA; --line:#E4E4E0; --hair:#EFEFEB;
  --dark:#161616; --on-dark:#FFFFFF; --on-dark-muted:#9E9E9E;
  --bad:#D9483B; --bad-soft:#FBE7E4; --pend:#9A6E17; --pend-soft:#F5ECD8; --ok:#141414;
  --k-meeting:#141414; --k-promise:#5C5C5C; --k-due:#141414; --k-reminder:#7A7A7A; --k-period:#A9A9A6;
  --shadow:0 4px 18px rgba(0,0,0,.05); --shadow-2:0 10px 28px rgba(0,0,0,.12);
  --willy-ink:#141414; --scrim:rgba(0,0,0,.4);
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Plus Jakarta Sans","Noto Sans TC",system-ui,sans-serif;
  --tabbar:66px; --r:22px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0F10; --surface:#1A1A1C; --surface-2:#242427; --weekend:#1E1E21; --band:#2C2C30;
  --ink:#F2F2F2; --muted:#8E8E93; --muted-2:#56565B; --line:#2C2C30; --hair:#26262A;
  --dark:#F2F2F2; --on-dark:#141414; --on-dark-muted:#5E5E62;
  --bad:#FF6B5E; --bad-soft:#3A1E1B; --pend:#E2B05A; --pend-soft:#352A15; --ok:#F2F2F2;
  --k-meeting:#F2F2F2; --k-promise:#B4B4B9; --k-due:#F2F2F2; --k-reminder:#9A9AA0; --k-period:#6E6E74;
  --shadow:0 4px 18px rgba(0,0,0,.35); --shadow-2:0 10px 28px rgba(0,0,0,.55);
  --willy-ink:#E9E9E9; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0F10; --surface:#1A1A1C; --surface-2:#242427; --weekend:#1E1E21; --band:#2C2C30;
  --ink:#F2F2F2; --muted:#8E8E93; --muted-2:#56565B; --line:#2C2C30; --hair:#26262A;
  --dark:#F2F2F2; --on-dark:#141414; --on-dark-muted:#5E5E62;
  --bad:#FF6B5E; --bad-soft:#3A1E1B; --pend:#E2B05A; --pend-soft:#352A15; --ok:#F2F2F2;
  --k-meeting:#F2F2F2; --k-promise:#B4B4B9; --k-due:#F2F2F2; --k-reminder:#9A9AA0; --k-period:#6E6E74;
  --shadow:0 4px 18px rgba(0,0,0,.35); --shadow-2:0 10px 28px rgba(0,0,0,.55);
  --willy-ink:#E9E9E9; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
html{scrollbar-gutter:stable} /* 電腦上：頁面長短不同時捲軸出現／消失，不讓內容左右跳 */
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:var(--surface-2);border-radius:12px;padding:6px 14px;min-height:42px;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--ink);color:var(--surface)}
button.ghost{background:transparent;color:var(--muted);font-weight:500}
button.small{min-height:36px;padding:3px 12px;font-size:.88rem}
button.warn{color:var(--bad)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input,textarea,select{background:var(--surface-2);border:1.5px solid transparent;border-radius:12px;padding:8px 12px;width:100%;min-height:46px}
input:focus,select:focus{border-color:var(--ink);outline:none}
svg{display:block}

.wrap{max-width:600px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-block:10px calc(var(--tabbar) + 56px); /* 每頁至少一個畫面高，短的那頁不會讓頁面突然縮 */padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;min-width:0}
main{display:flex;flex-direction:column;gap:18px;min-width:0}
.block{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}

/* 頁首只放兩樣：左邊日期與大標題，右邊 Willy；Willy 右下的小點是同步狀態（綠＝同步中、灰＝範例資料、紅＝停了） */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px}
.ttl{display:flex;flex-direction:column;gap:2px;min-width:0}
.ttl .sub{font-size:.85rem;color:var(--muted);font-weight:500}
.ttl h1{margin:0;font-size:2rem;font-weight:700;letter-spacing:.01em;line-height:1.15}
.mewrap{position:relative;flex:none}
.me{width:44px;height:44px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.me svg{width:100%;height:100%}
.st{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;border:2.5px solid var(--bg);background:var(--muted-2)}
.st.ok{background:#2FA36B} .st.bad{background:var(--bad)}
/* 要處理的（待記入、失敗、衝突、同步停了）才出現，接在大標題右邊 */
.trow{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;min-width:0}
.sync{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:4px} /* 貼著標題底部 */
.sync:empty{display:none}
.info{text-align:center;font-size:.75rem;color:var(--muted-2);font-weight:500}
.info b{color:var(--muted);font-weight:600}
.info .ver{font-size:.75rem} /* 每版改這裡，交貨測試對版號 */
.pill{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:999px;padding:2px 10px;background:var(--surface);box-shadow:var(--shadow);color:var(--muted);min-height:0;font-size:.75rem;font-weight:600;line-height:1.6}
.pill.ok::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink)}
.pill.pend{color:var(--pend)}
.pill.bad{color:var(--bad)}
.pill.sample{background:var(--surface-2);box-shadow:none}

/* 一週：一天一欄，選到的是黑色直條 */
.week{display:flex;flex-direction:column;gap:8px}
.wkhead{display:flex;align-items:center;justify-content:space-between}
.wkm{font-size:.85rem;color:var(--muted);font-weight:600}
.wknav{display:flex;gap:6px;align-items:center}
.wknav .nav{width:34px;min-height:34px;padding:0;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.wknav .nav svg{width:16px;height:16px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;padding:4px 0;min-height:0;border-radius:999px;font-weight:500}
.wd .wn{font-family:var(--f-num);font-weight:700;font-size:1.05rem;color:var(--muted);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.wd .wl{font-size:.72rem;color:var(--muted-2)}
.wd .wdot{width:5px;height:5px;border-radius:50%;background:transparent;margin-top:3px}
.wd.has .wdot{background:var(--muted-2)}
.wd.over .wdot{background:var(--bad)}
.wd.today .wn,.wd.today .wl{color:var(--ink)}
.wd.sel .wn{background:var(--dark);color:var(--on-dark)}
.wd.sel .wl{color:var(--ink)}

/* 三個數字 */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:12px 6px}
.stat{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:2px 14px;background:none;border-radius:0;min-height:0;text-align:left}
.stat+.stat{border-left:1.5px solid var(--hair)}
.stat .n{font-family:var(--f-num);font-size:1.6rem;font-weight:700;line-height:1.2}
.stat .l{font-size:.78rem;color:var(--muted);font-weight:500}
.stat.hot .n{color:var(--bad)}

/* 區塊標題 */
.bhead{display:flex;align-items:center;gap:8px;padding:16px 18px 6px}
.bhead h2{margin:0;font-size:1.02rem;font-weight:700}
.bhead .cnt{font-family:var(--f-num);font-size:.78rem;font-weight:700;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:0 8px;line-height:1.7}
.bhead .cnt.hot{color:var(--bad);background:var(--bad-soft)}

/* 一列一件（完成了嗎？）：方形勾選、內容、右邊時間 */
.rows{display:flex;flex-direction:column;padding:2px 8px 8px}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:14px;cursor:pointer;min-width:0}
.row+.row{border-top:1.5px solid var(--hair);border-top-left-radius:0;border-top-right-radius:0}
@media (hover:hover){.row:hover,.ti:hover .tc{background:var(--surface-2)}}
.ck{width:26px;height:26px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--muted-2);background:transparent;display:flex;align-items:center;justify-content:center;flex:none;color:var(--surface)}
.ck svg{width:14px;height:14px;opacity:0}
.ck.on{background:var(--ink);border-color:var(--ink)} .ck.on svg{opacity:1}
@media (hover:hover){.ck:not(.on):not(.off):hover svg{opacity:.5;color:var(--ink)}}
.ck.off{visibility:hidden}
.ico{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--ink);flex:none}
.ico svg{width:22px;height:22px}
.rmain{min-width:0;display:flex;flex-direction:column;gap:1px}
.rmain .t{font-weight:500;font-size:.95rem;overflow-wrap:anywhere;line-height:1.4}
.who{font-size:.8rem;color:var(--muted)}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.chip{font-size:.7rem;font-weight:600;border-radius:999px;padding:0 8px;line-height:1.7;background:var(--surface-2);color:var(--muted)}
.chip.pend{background:var(--pend-soft);color:var(--pend)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.rtime{font-family:var(--f-num);font-weight:600;font-size:.88rem;color:var(--muted);text-align:right;white-space:nowrap}
.rtime.late{color:var(--bad);font-family:var(--f-body);font-size:.78rem;font-weight:700}
.row.done .t,.row.cancelled .t{text-decoration:line-through;color:var(--muted)}
.row.past .t{color:var(--muted)}
.more{display:block;margin:0 auto 14px;font-size:.85rem}

/* 時間軸：左邊一條細線，線上的圓圈就是勾選；最先要做的那件淺灰底 */
.tl{position:relative;display:flex;flex-direction:column;padding:4px 12px 12px}
.tl::before{content:"";position:absolute;left:26.25px;top:24px;bottom:30px;width:1.5px;background:var(--line)}
.ti{display:grid;grid-template-columns:30px minmax(0,1fr);gap:6px;align-items:start;cursor:pointer;position:relative}
.ti .node{width:30px;height:30px;min-height:0;padding:0;margin-top:7px;border-radius:50%;border:2px solid var(--muted-2);background:var(--surface);display:flex;align-items:center;justify-content:center;position:relative;z-index:1;color:var(--surface)}
.ti .node svg{width:15px;height:15px;opacity:0}
@media (hover:hover){.ti .node:not(.on):not(.off):hover{border-color:var(--ink)} .ti .node:not(.on):not(.off):hover svg{opacity:.45;color:var(--ink)}}
.ti .node.on{background:var(--ink);border-color:var(--ink)} .ti .node.on svg{opacity:1}
.ti .node.off{border-style:dashed;cursor:default}
.ti.feat .node:not(.on){border-color:var(--ink)}
.ti .tc{padding:10px 12px;border-radius:14px;min-width:0;margin-bottom:2px}
.next{font-size:.7rem;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-bottom:2px}
.ttop{display:flex;align-items:baseline;gap:10px}
.ttop .t{flex:1;min-width:0;font-weight:600;font-size:.98rem;line-height:1.4;overflow-wrap:anywhere}
.ttop .tt{font-family:var(--f-num);font-weight:600;font-size:.85rem;color:var(--muted);white-space:nowrap}
.ti .who{margin-top:2px}
.ti.done .t,.ti.cancelled .t{text-decoration:line-through;color:var(--muted)}
.ti.past .t{color:var(--muted)}
.ti.feat .tc{background:var(--surface-2)}
.ti.feat .ttop .tt{color:var(--ink)}
.ti.feat .chip{background:var(--surface)}
.empty{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 16px 20px;color:var(--muted);font-weight:500;font-size:.9rem;text-align:center}
.empty svg{width:84px;height:84px}

/* 自己做的下拉：按鈕＋浮出的清單（分組小標、選到的打勾、名單長就有搜尋） */
.pick{position:relative;flex:1;min-width:0}
.pickbtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--band);min-height:40px;border-radius:12px;padding:6px 12px;font-weight:600;color:var(--ink);text-align:left}
.pickbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pickbtn svg{width:16px;height:16px;flex:none;color:var(--muted);transition:transform .15s}
.pick.open .pickbtn svg{transform:rotate(180deg)}
.sheet .pickbtn{background:var(--surface-2);min-height:46px;font-weight:500}
.pickpanel{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:var(--surface);border-radius:14px;box-shadow:var(--shadow-2);padding:6px;max-height:min(360px,60vh);overflow:auto;display:flex;flex-direction:column}
.pickpanel input{min-height:38px;margin:2px 2px 6px;width:auto}
.pgh{font-size:.72rem;color:var(--muted);font-weight:700;padding:10px 10px 4px;letter-spacing:.04em}
.popt{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:transparent;min-height:40px;padding:6px 10px;border-radius:10px;font-weight:500;text-align:left;color:var(--ink)}
@media (hover:hover){.popt:hover{background:var(--surface-2)}}
.popt svg{width:16px;height:16px;flex:none;opacity:0}
.popt[aria-selected="true"]{font-weight:700} .popt[aria-selected="true"] svg{opacity:1}

/* 篩選與分段 */
.filters{display:flex;gap:8px;align-items:center}
.filters select{flex:1;min-width:0;font-weight:600;background:var(--band);min-height:40px}
button.toggle{white-space:nowrap;font-size:.88rem;border-radius:999px;background:var(--band);min-height:40px}
button.toggle[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg{display:inline-flex;border-radius:999px;padding:3px;gap:2px;background:var(--surface-2);max-width:100%}
.seg button{background:transparent;min-height:32px;padding:2px 12px;font-size:.85rem;color:var(--muted);border-radius:999px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* 月曆 */
.mblock{padding:14px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 4px 10px}
.mtitle{font-size:1.1rem;font-weight:700}
.mnav{display:flex;gap:6px} .mnav button{border-radius:999px}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.mgrid .wdh{text-align:center;font-size:.72rem;color:var(--muted-2);font-weight:600;padding-bottom:4px}
.cell{aspect-ratio:1;max-width:100%;min-height:0;border-radius:12px;padding:3px 1px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;background:transparent;font-weight:500}
.cell.pad{pointer-events:none}
.cell .dn{font-family:var(--f-num);font-size:.95rem;font-weight:600;line-height:32px;width:32px;height:32px;border-radius:50%;text-align:center;color:var(--muted)}
.cell.today .dn{color:var(--ink);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--ink)}
.cell.sel .dn{background:var(--dark);color:var(--on-dark);box-shadow:none}
.cell.over:not(.sel) .dn{color:var(--bad)}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:100%}
.dot{width:5px;height:5px;border-radius:50%}
.dot.past{opacity:.35}

/* 甘特圖：一張白卡；日期軸在最上面、捲動時黏住；每個對象一段，單雙數交替淡底，點名字收起／展開 */
.gwrap{display:flex;flex-direction:column;gap:12px;min-width:0;--gbg:none;--gday:var(--hair);--gmon:var(--muted-2)}
/* 甘特圖控制：不用卡片，直接放在灰底上三層（翻頁與日期範圍、看多長、分組與全部收起），讓下面的圖是主角 */
.gctl{padding:0 2px;display:flex;flex-direction:column;gap:8px}
.gctl .seg{background:var(--band)}
.gtop{display:flex;align-items:center;gap:2px;min-height:36px}
.gtop .range{font-family:var(--f-num);font-size:1rem;font-weight:600;margin:0;padding:0 4px;white-space:nowrap}
.gtop .nav{width:34px;min-height:34px;padding:0;border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center;flex:none}
.gtop .nav svg{width:18px;height:18px}
@media (hover:hover){.gtop .nav:hover{background:var(--surface-2)}}
.gtop .sp,.gopts .sp{flex:1}
button.link{background:transparent;min-height:32px;padding:2px 6px;font-size:.88rem;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--muted-2)}
.seg.full{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%}
.gopts{display:flex;align-items:center;gap:8px}
.glab{font-size:.8rem;color:var(--muted);font-weight:600}
.gopts .seg button{min-height:26px;padding:1px 10px;font-size:.78rem}
.legend{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);align-items:center;padding:8px 2px 2px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend svg{width:12px;height:12px}
details.lg summary{cursor:pointer;color:var(--muted);font-size:.85rem;font-weight:600;width:max-content;padding:4px 2px}
.gbig{overflow:clip}
.gaxis{padding:8px 14px 2px;position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--surface)}
.gblock{display:flex;flex-direction:column;padding:0 14px 6px;border-top:1.5px solid var(--hair)}
.gblock.alt{background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
.gblock.folded{padding-bottom:0}
.gblock .grow{padding:5px 0}
.gfold{display:grid;grid-template-columns:38% minmax(0,1fr);gap:8px;align-items:center;margin:0 -14px;padding:10px 14px 4px;background:transparent;border-radius:0;min-height:0;text-align:left;cursor:pointer}
.gblock.folded .gfold{padding-bottom:10px}
.gblock:not(.folded) .gfold{grid-template-columns:minmax(0,1fr)}
.gfold .gname{display:flex;align-items:center;gap:6px;min-width:0;font-weight:700;font-size:.92rem}
.gfold .gname span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gfold .gname svg{width:16px;height:16px;flex:none;color:var(--muted);transition:transform .15s}
.gblock.folded .gfold .gname svg{transform:rotate(-90deg)}
.gfold .gn{font-family:var(--f-num);font-weight:600;font-size:.78rem;color:var(--muted);flex:none}
.gfold .gtrack{height:18px}
.mdot{position:absolute;top:5px;width:8px;height:8px;border-radius:50%;transform:translateX(-50%);background:var(--k)}

UI.right='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';
for(const k of ["alarm","sun","week","page","move","okbig"]) UI[k]=UI[k].replace(/stroke="#1F2433"/g,'stroke="currentColor"').replace(/ fill="#[0-9A-Fa-f]+"/g,"");
function actOf(it){const m=/^(.{1,4})｜/.exec(it.text||"");return m&&ACTS[m[1]]?m[1]:null;}
function plainText(it){return actOf(it)?it.text.replace(/^.{1,4}｜/,""):it.text;}
const WD=["日","一","二","三","四","五","六"];
const $=s=>document.querySelector(s);
const todayStr=()=>iso(new Date());
function iso(d){const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10);}
function addDays(n,base){const x=base?new Date(base+"T00:00"):new Date();x.setDate(x.getDate()+n);return iso(x);}
function dayDiff(a,b){return Math.round((new Date(b+"T00:00")-new Date(a+"T00:00"))/864e5);}
function shiftMonth(cur,n){const [y,m]=cur.split("-").map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;}
function dayLabel(s){const d=new Date(s+"T00:00");const diff=Math.round((d-new Date(todayStr()+"T00:00"))/864e5);
  const base=`${d.getMonth()+1}/${d.getDate()} 週${WD[d.getDay()]}`;
  return diff===0?`今天 ${base}`:diff===1?`明天 ${base}`:diff<0?`${base}（逾期 ${-diff} 天）`:base;}
function clockLabel(t){return t?t.slice(0,5):"";}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
const md=s=>s.slice(5).replace("-","/");

// ---------- Willy（紫身、黃髮黃眼鏡、得意臉）；手腳線條跟主題走，臉固定深色 ----------
function willy(mood,crop){
  const B="#8B7CF6",A="#FFC531",F="#1F2433",L="var(--willy-ink)";
  const ln=(d,w=3.5,c=L)=>`<path d="${d}" stroke="${c}" stroke-width="${w}" fill="none"/>`;
  const fing=(x,y,a)=>{const r=v=>v*Math.PI/180,f=d=>`M${x} ${y} l${(7*Math.cos(r(a+d))).toFixed(1)} ${(7*Math.sin(r(a+d))).toFixed(1)}`;return ln(f(-40)+f(0)+f(40));};
  const shoe=(x,y,d=1)=>`<path transform="translate(${x},${y}) scale(${d},1)" d="M-10 4 Q-10 -6 0 -6 Q9 -6 10 4Z" fill="${L}"/>`;
  const legs={stand:ln("M-18 54 Q-21 74 -18 90 M18 54 Q21 74 18 90")+shoe(-22,92)+shoe(22,92),
    jump:ln("M-16 54 Q-30 64 -24 78 M16 54 Q30 64 24 78")+shoe(-28,81,-1)+shoe(28,81),
    cross:ln("M-16 54 Q-2 74 12 90 M16 54 Q4 74 -10 90")+shoe(16,92)+shoe(-14,92,-1)};
  const ey=4,er=11,cx=30,w=48,h=44,gap=cx-w/2,my=ey+h/2+7;
  const eyeW=x=>`<ellipse cx="${x}" cy="${ey}" rx="${er}" ry="${er*1.2}" fill="#fff"/>`;
  const lid=(x,px,py,lv=-1)=>eyeW(x)+`<circle cx="${x+px}" cy="${ey+py}" r="5.7" fill="${F}"/><path d="M${x-er-1} ${ey+lv} Q${x} ${ey+lv-3} ${x+er+1} ${ey+lv} L${x+er+1} ${ey-15} L${x-er-1} ${ey-15}Z" fill="${B}"/>`+ln(`M${x-er+1} ${ey+lv} Q${x} ${ey+lv-3} ${x+er-1} ${ey+lv}`,2.6,F);
  const arcE=x=>ln(`M${x-8} ${ey+3} Q${x} ${ey-8} ${x+8} ${ey+3}`,3.4,F);
  const smirk=ln(`M-8 ${my+1} Q2 ${my+7} 10 ${my-3}`,3,F);
  const faces={smug:lid(-cx,1,4)+lid(cx,1,4)+smirk,
    cheer:arcE(-cx)+arcE(cx)+`<path d="M-12 ${my-2} Q0 ${my+16} 12 ${my-2}Z" fill="${F}"/>`,
    coffee:lid(-cx,0,6,4)+lid(cx,0,6,4)+ln(`M-8 ${my} Q0 ${my+6} 8 ${my}`,3,F),
    think:eyeW(-cx)+eyeW(cx)+`<circle cx="${-cx-4}" cy="${ey-5}" r="5.7" fill="${F}"/><circle cx="${cx-4}" cy="${ey-5}" r="5.7" fill="${F}"/>`+ln(`M-7 ${my+2} Q0 ${my-1} 7 ${my+3}`,3,F)};
  const frame=x=>`<rect x="${x-w/2}" y="${ey-h/2}" width="${w}" height="${h}" rx="15" fill="none" stroke="${A}" stroke-width="5.5"/>`;
  const glasses=frame(-cx)+frame(cx)+ln(`M${-gap-1} ${ey-7} Q0 ${ey-17} ${gap+1} ${ey-7}`,5.5,A)+ln(`M-54 ${ey-8} L-59 ${ey-10} M54 ${ey-8} L59 ${ey-10}`,5,A);
  const hair=`<path transform="translate(0,-40)" d="M-12 4 C-14 -4 -18 -12 -25 -15 C-27 -16 -27 -20 -23 -21 C-16 -23 -11 -17 -8 -10 Q-6 -7 -4 -9 C-3 -12 -1 -15 0 -15 C1 -15 3 -12 4 -9 Q6 -7 8 -10 C11 -17 16 -23 23 -21 C27 -20 27 -16 25 -15 C18 -12 14 -4 12 4 Z" fill="${A}" stroke="${A}" stroke-width="2"/>`;
  const body=`<path d="M-60 26 C-62 -14 -34 -44 0 -44 C34 -44 62 -14 60 26 C58 50 32 62 0 62 C-32 62 -58 50 -60 26Z" fill="${B}"/>`;
  const arms={smug:ln("M-56 22 C-66 26 -72 36 -76 46 M56 22 C66 26 72 36 76 46")+fing(-76,46,110)+fing(76,46,70),
    cheer:ln("M-56 16 C-66 10 -72 -4 -74 -16 M56 16 C66 10 72 -4 74 -16")+fing(-74,-16,-90)+fing(74,-16,-90),
    coffee:ln("M-56 22 C-74 24 -74 44 -60 44 M56 24 C60 40 54 46 44 46"),
    think:ln("M-56 22 C-74 24 -74 44 -60 44")}[mood]||"";
  const front={coffee:`<g transform="translate(46,42)" stroke="${F}"><path d="M-12 -10 L12 -10 L9 12 Q8 15 5 15 L-5 15 Q-8 15 -9 12Z" fill="#fff" stroke-width="2.5"/><path d="M12 -5 Q19 -5 18 2 Q17 7 10 7" stroke-width="2.5" fill="none"/><rect x="-11" y="-2" width="21" height="6" fill="${A}" stroke="none"/><path d="M-4 -16 q-3 -4 0 -8 M4 -16 q-3 -4 0 -8" stroke="#9aa0ab" stroke-width="2.2" fill="none"/></g>`,
    think:ln("M56 24 C50 44 30 48 14 42")+fing(14,42,200)+`<path d="M62 -60 Q62 -72 72 -72 Q82 -72 82 -63 Q82 -56 73 -53 L73 -47" stroke="${A}" stroke-width="5" fill="none"/><circle cx="73" cy="-38" r="3.2" fill="${A}"/>`,
    cheer:`<path d="M58 -40 L70 -26 L94 -56" stroke="#3BB273" stroke-width="9" fill="none"/>`}[mood]||"";
  const t={coffee:"translate(0,60) rotate(6) scale(1.04,.97) translate(0,-60)",think:"translate(0,60) rotate(-10) translate(0,-60)"}[mood]||"";
  const up=`${arms}${hair}${body}${faces[mood]||faces.smug}${glasses}${front}`;
  const inner=mood==="cheer"?`<ellipse cx="0" cy="100" rx="34" ry="5" fill="var(--hair)"/><g transform="translate(0,-14)">${legs.jump}${up}</g>`:`${mood==="coffee"?legs.cross:legs.stand}<g transform="${t}">${up}</g>`;
  return `<svg viewBox="${crop||"-100 -82 200 196"}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
}

const S={tab:"today",data:null,sample:true,mcp:null,pending:[],ganttGroup:"client",monthCursor:null,selectedDay:null,day:null,showDone:false,clientFilterAgenda:""};
try{S.pending=JSON.parse(localStorage.getItem("pending")||"[]");}catch{S.pending=[];}
function savePending(){try{localStorage.setItem("pending",JSON.stringify(S.pending));}catch{}}
function pendingFor(id){return S.pending.filter(p=>p.id===id);}

// ---------- 畫面 ----------
function renderSync(){
  const el=$("#sync"); el.innerHTML="";
  const st=S.data.status||{};
  // 平常只看 Willy 右下的小點與頁尾一行；同步停了才在標題下面提醒
  const dot=$("#st"), info=$("#syncinfo");
  // 範例資料要一眼看得出來，不能只靠頁尾小字（交貨測試 D-42）
  if(S.sample){ dot.className="st"; dot.title="範例資料"; info.textContent="・範例資料"; el.append(pill("範例資料，不是你的日程","pend")); }
  else if(st.last_ok_at){ const min=Math.round((Date.now()-new Date(st.last_ok_at))/6e4), hm=new Date(st.last_ok_at).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false});
    dot.className="st "+(min>12?"bad":"ok"); dot.title=`同步於 ${hm}`; info.textContent=`・同步於 ${hm}`;
    if(min>12) el.append(pill(`同步停了 ${min} 分鐘`,"bad")); }
  else { dot.className="st"; dot.title=""; info.textContent=""; }
  const failed=S.pending.filter(p=>p.state&&p.state!=="applied"&&p.state!=="retry"||p.failed);
  if(S.pending.length){ const b=btn(`待記入 ${S.pending.length}`,"pill pend",openPendingSheet); el.append(b); }
  if(failed.length) el.append(btn(`${failed.length} 筆失敗`,"pill bad",openPendingSheet));
  if((st.conflicts||[]).length) el.append(pill(`${st.conflicts.length} 筆衝突`,"bad"));
}
function pill(t,c){const s=document.createElement("span");s.className="pill "+(c||"");s.textContent=t;return s;}
function btn(t,c,fn){const b=document.createElement("button");b.className=c;b.textContent=t;b.onclick=fn;return b;}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function html(tag,cls,h){const e=el(tag,cls);e.innerHTML=h;return e;}
// 分段按鈕：opts＝[[值,字]]，目前那個 aria-pressed
function seg(opts,cur,fn,label){const s=el("div","seg"); s.setAttribute("role","group"); if(label) s.setAttribute("aria-label",label);
  opts.forEach(([k,l])=>{const b=btn(l,"",()=>fn(k)); b.setAttribute("aria-pressed",String(k===cur)); s.append(b);}); return s;}

// 畫面用「套上手機待套用改動」後的樣子：改期的在新位置、打勾／取消的劃掉並收起按鈕（測試 ⚠️3、⚠️6）
function effective(){ return S.data.agenda.items.map(it=>{ const ps=pendingFor(it.id); if(!ps.length) return it; const v={...it};
  ps.forEach(p=>{ if(p.op==="edit"){ if(p.date) v.date=p.date; if(p.start) v.start=p.start; } if(p.op==="done") v.pendDone=true; if(p.op==="cancel") v.pendCancel=true; }); return v; }); }
// 重新整理後把手機上還沒套用的新增放回畫面（測試 ⚠️2）
function applyPending(p){
  const items=S.data.agenda.items, cs=S.data.clients.clients;
  if(p.op==="add"&&!items.some(i=>i.id===p.id)) items.push({id:p.id,kind:p.kind,date:p.date,time:p.time,start:p.start,text:p.text,entities:p.entities||[],status:"open",source:"confirmed",pendingAdd:true});
  if((p.op==="entity"||(p.op==="statement"&&p.new_entity))&&!cs.some(c=>c.name===p.entity)) cs.push({id:"tmp-"+p.cid,name:p.entity,last_contact:iso(new Date(p.at)),pending_statements:0,sections:{},statements:[],pendingAdd:true});
  if(p.next_meeting&&p.nm_id&&!items.some(i=>i.id===p.nm_id)) items.push({id:p.nm_id,kind:"meeting",date:p.next_meeting.date,time:p.next_meeting.time,text:"拜訪｜下次見面（記一筆時約的）",entities:[p.entity],status:"open",source:"confirmed",pendingAdd:true});
}
function dayPlain(s){const d=new Date(s+"T00:00");const diff=dayDiff(todayStr(),s);return `${d.getMonth()+1}/${d.getDate()} 週${WD[d.getDay()]}`+(diff===0?"・今天":diff===1?"・明天":"");}
function bucket(it){const t=todayStr(); if(it.date<t) return "over"; if(it.date===t) return "today"; if(it.date<=addDays(7)) return "week"; if(it.date<=addDays(30)) return "month"; return "later";}
function openItems(){return effective().filter(i=>i.status==="open");}
const isClosed=it=>it.status!=="open"||it.pendDone||it.pendCancel;

// 過了、還開著（jacky 2026-10-26：「開起來時應該顯示請問是否完成」）：有時間的看到分鐘；沒時間的與期間看日期（期間的 date＝結束日）
const nowHM=()=>{const d=new Date(),z=n=>String(n).padStart(2,"0");return `${z(d.getHours())}:${z(d.getMinutes())}`;};
function isPast(it){const t=todayStr(); return it.date<t||it.date===t&&!!it.time&&it.kind!=="period"&&clockLabel(it.time)<nowHM();}
const pastToday=it=>it.date===todayStr()&&isPast(it); // 今天、時間已過：淡一點，不標紅
const askable=it=>isPast(it)&&!it.pendDone&&!it.pendCancel&&!it.pendingAdd; // 進「完成了嗎？」的；今天那張就不再列一次

// 一列一件（完成了嗎？）：左邊方框直接打勾、內容、右邊時間或逾期幾天；點整列開詳情
function chipsOf(it){
  const chips=el("div","chips"), conf=(S.data.status.conflicts||[]).find(c=>c.id===it.id);
  if(repOf(it)) chips.append(el("span","chip",repOf(it)));
  if(it.source==="inferred") chips.append(el("span","chip","推測"));
  if(it.pendingAdd) chips.append(el("span","chip pend","待記入"));
  pendingFor(it.id).forEach(p=>chips.append(el("span","chip "+(p.state&&p.state!=="retry"?"bad":"pend"),p.state==="rejected"?"沒套用":p.state==="conflict"?"衝突":`待${opLabel(p)}`)));
  if(conf) chips.append(el("span","chip bad","衝突"));
  return chips;
}
function openOnTap(r,it){ r.tabIndex=0; r.setAttribute("role","button"); r.setAttribute("aria-label",`${plainText(it)}，${dayLabel(it.date)}，看詳情`);
  r.onclick=()=>openItem(it); r.onkeydown=ev=>{ if(ev.target===r&&(ev.key==="Enter"||ev.key===" ")){ev.preventDefault();openItem(it);} }; }
function rowEl(it,opt={}){
  const closed=isClosed(it), canAct=!closed&&!it.pendingAdd, isDone=it.status==="done"||it.pendDone;
  const r=el("div","row "+(it.pendDone?"done":it.pendCancel?"cancelled":it.status)+(!closed&&pastToday(it)&&!opt.late?" past":""));
  const ck=html("button","ck"+(isDone?" on":"")+(!canAct&&!isDone?" off":""),UI.check);
  ck.setAttribute("aria-label",canAct?`完成：${plainText(it)}`:"已完成");
  ck.onclick=ev=>{ev.stopPropagation(); if(canAct) doneAsk(it);}; if(!canAct) ck.tabIndex=-1;
  const main=el("div","rmain"); main.append(el("div","t",plainText(it)));
  main.append(el("div","who",[actOf(it)||KINDS[it.kind]||it.kind,...(it.entities||[])].join("・")));
  const chips=chipsOf(it); if(chips.children.length) main.append(chips);
  const n=dayDiff(it.date,todayStr());
  const tm=opt.late&&n>0?el("div","rtime late",`逾期 ${n} 天`):el("div","rtime",it.time?clockLabel(it.time):it.start&&it.kind==="period"?`～${md(it.date)}`:"");
  r.append(ck,main,tm); openOnTap(r,it);
  return r;
}
// 時間軸：左邊一條細線串起每件事；線上的圓圈就是勾選，點了直接問「做完了？」，點其他地方開詳情。
// 每列都一樣：標題、右邊時間，第二行是種類與對象；最先要做的那件只多一個淺灰底和「下一件」
function timeline(list){
  const box=el("div","tl"), t=todayStr();

      const pin=e<from, act=actOf(it), canDrag=!closed&&!it.pendingAdd&&!pin; // 釘住的不給拖：圖在邊界、日期在畫面外，拖了對不上；改期點列用抽屜

      if(pin) tr.append(el("span","gpin"));

      else if(it.kind==="period"||it.start){ const bar=el("span","gbar"+(late?" run":"")+(s<from?" cl":"")+(e>toD?" cr":"")); bar.style.left=pct(si)+"%"; bar.style.width=(pct(ei-si+1))+"%"; tr.append(bar);

            d=>{const ns=addDays(d,s); if(ns>e){toast("開始不能晚於結束");render();return;} ask({op:"edit",id:it.id,start:ns,from_start:s},`「${plainText(it)}」開始日改到 ${dayLabel(ns)}？`,`原本 ${dayLabel(s)}${repNote(it)}`,`開始改到 ${ns.slice(5)}`,render);}); } }

// ---------- 抽屜：新增／確認（記一筆、客戶分頁、新客戶 v13 拿掉：C001 2026-10-26 說手機只要甘特圖、月曆、今日提醒） ----------
let sheetEl=null;
// 表單抽屜有草稿時：點背景不關、提示按取消；取消要按兩次才丟（測試 ⚠️1）
function guardCancel(hasDraft){
  const b=btn("取消","ghost",()=>{ if(hasDraft()&&b.textContent==="取消"){ b.textContent="確定丟掉？"; b.classList.add("warn"); setTimeout(()=>{b.textContent="取消";b.classList.remove("warn");},3000); return; } closeSheet(); });
  queueMicrotask(()=>{ if(sheetEl) sheetEl[0].onclick=()=>{ if(hasDraft()){ toast("還沒送出；要丟掉請按「取消」"); return; } closeSheet(); }; });
  return b; }
function sheet(build){ closeSheet(); const sc=el("div","scrim"); sc.onclick=closeSheet;
  const sh=el("div","sheet"); sh.setAttribute("role","dialog"); sh.setAttribute("aria-modal","true");
  sheetEl=[sc,sh]; build(sh); // 先設引用再 build，build 裡才能改 scrim 的行為
  document.body.append(sc,sh); }
function closeSheet(){ if(sheetEl){sheetEl.forEach(e=>e.remove()); sheetEl=null;} }

// 「跟誰有關」的選項：agenda.entities（{id,name,type}）依 ENT_TYPES 分組；沒 type 的舊資料當客戶；沒有名單就用客戶卡
function entityGroups(){
  const ents=S.data.agenda.entities, by=new Map(ENT_TYPES.map(t=>[t,[]]));
  if(Array.isArray(ents)&&ents.length) ents.forEach(e=>{ const t=e.type||"客戶"; if(by.has(t)&&e.name) by.get(t).push(e.name); });
  else S.data.clients.clients.forEach(c=>by.get("客戶").push(c.name));
  return [...by].filter(([,n])=>n.length); }
// 下拉選單（取代原生 select，電腦上原生的很醜）：按鈕顯示目前選的；點開是浮出的清單，分組小標、選到的打勾；名單超過 8 個多一格搜尋
function picker({id,value,groups,onChange,label}){
  const all=groups.flatMap(g=>g.items), w=el("div","pick"), b=el("button","pickbtn"), txt=el("span");
  b.id=id; b.type="button"; b.setAttribute("aria-haspopup","listbox"); b.setAttribute("aria-expanded","false"); if(label) b.setAttribute("aria-label",label);
  b.append(txt); b.insertAdjacentHTML("beforeend",UI.chev);
  let cur=value; const show=()=>{ txt.textContent=(all.find(i=>i.v===cur)||all[0]).label; }; show();
  const panel=el("div","pickpanel"); panel.hidden=true; panel.setAttribute("role","listbox");
  const close=()=>{ panel.hidden=true; w.classList.remove("open"); b.setAttribute("aria-expanded","false"); };
  const build=q=>{ panel.querySelectorAll(".pgh,.popt").forEach(x=>x.remove()); let n=0;
    groups.forEach(g=>{ const its=g.items.filter(i=>!q||i.label.includes(q)); if(!its.length) return;
      if(g.label) panel.append(el("div","pgh",g.label));
      its.forEach(i=>{ const o=el("button","popt"); o.type="button"; o.setAttribute("role","option"); o.setAttribute("aria-selected",String(i.v===cur));
        o.append(el("span",null,i.label)); o.insertAdjacentHTML("beforeend",UI.check);
        o.onclick=()=>{ cur=i.v; show(); close(); onChange(cur); }; panel.append(o); n++; }); });
    if(!n) panel.append(el("div","pgh","找不到")); };
  if(all.length>8){ const q=document.createElement("input"); q.id=id+"-q"; q.placeholder="搜尋名字"; q.setAttribute("aria-label","搜尋名字"); q.oninput=()=>build(q.value.trim()); panel.append(q); }
  build("");
  b.onclick=ev=>{ ev.stopPropagation(); const opening=panel.hidden; closePickers();
    if(opening){ panel.hidden=false; w.classList.add("open"); b.setAttribute("aria-expanded","true"); const q=panel.querySelector("input"); if(q) q.focus(); } };
  w.addEventListener("pickclose",close);
  w.append(b,panel); return w;
}
function closePickers(except){ document.querySelectorAll(".pick.open").forEach(p=>{ if(p!==except) p.dispatchEvent(new Event("pickclose")); }); }
document.addEventListener("pointerdown",ev=>{ const p=ev.target.closest&&ev.target.closest(".pick"); closePickers(p); });
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape") closePickers(); });
// 對象清單：最前面放固定的幾項，後面照 ENT_TYPES 分組
function entityPickGroups(...head){ return [{label:null,items:head}, ...entityGroups().map(([t,names])=>({label:t,items:names.map(n=>({v:n,label:n}))}))]; }
function openAdd(){

    const start=document.createElement("input"); start.type="date"; start.id="add-start"; const startF=el("div","field"); const sl=el("label",null,"開始日"); sl.htmlFor=start.id; startF.append(sl,start);
    const paint=()=>{ grid.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.a===act))); const k=ACTS[act].kind;
      if(k==="period") withStart.checked=true; startF.hidden=!withStart.checked; };
    Object.entries(ACTS).forEach(([a,c])=>{const b=el("button"); const ic=el("span","ico"); ic.innerHTML=svgI(ICON[a]); b.append(ic,a); b.dataset.a=a; b.onclick=()=>{act=a;paint();}; grid.append(b);});
    const date=document.createElement("input"); date.type="date"; date.id="add-date"; date.value=todayStr(); date.setAttribute("aria-label","日期");
    const time=document.createElement("input"); time.type="time"; time.id="add-time"; time.setAttribute("aria-label","時間（可不填）");

    let whoV=""; const who=picker({id:"add-who",value:"",groups:entityPickGroups({v:"",label:"自己的事"}),onChange:v=>{whoV=v;}});
    const dt=el("div","inline"); dt.append(date,time);
    const chk=el("label","check-row"); chk.append(withStart, document.createTextNode("有工期")); withStart.onchange=paint;
    [[null,grid],[null,text],["對象",who,"add-who"],["日期",dt],[null,chk],[null,startF]].forEach(([l,x,id])=>{const f=el("div","field"); if(l){const lb=el("label",null,l); if(id) lb.htmlFor=id; f.append(lb);} f.append(x); sh.append(f);});
    paint();
    const foot=el("div","foot");
    foot.append(guardCancel(()=>text.value.trim()), btn("新增","primary",()=>{ if(!text.value.trim()){toast("寫一句話");return;}
      const ch={op:"add",kind:ACTS[act].kind,date:date.value,time:time.value||null,text:`${act}｜${text.value.trim()}`,entities:whoV?[whoV]:[]};
      if(withStart.checked){ if(!start.value){toast("填開始日");return;} if(start.value>date.value){toast("開始不能晚於結束");return;} ch.start=start.value; }
      if(ch.kind==="period"&&!whoV){toast("期間要選一個對象（客戶、團隊或公司）");return;}

// 所有會寫回的按鈕都先確認（使用者裁示 2026-10-25）；onCancel 用來把拖曳放回原位
function confirmSheet(title,hint,fn,onCancel){ sheet(sh=>{ sh.append(el("h3",null,title), el("p","hint",hint));
  const no=()=>{closeSheet(); if(onCancel) onCancel();};
  const foot=el("div","foot"); foot.append(btn("不要","ghost",no), btn("確定","primary",()=>{closeSheet();fn();})); sh.append(foot);

// 待記入清單：每筆的狀態與原因；被拒的可以移除（口述文字留在 Drive 的變動檔裡，不會丟）
function openPendingSheet(){
  sheet(sh=>{
    sh.append(el("h3",null,"待記入"), el("p","hint","電腦收到後會自己消失。"));
    if(!S.pending.length) sh.append(emptyEl("coffee","沒有待記入"));
    const box=el("div","block rows"); box.style.padding="4px 6px";
    S.pending.forEach(p=>{ const c=el("div","row"); c.style.cssText="grid-template-columns:minmax(0,1fr);cursor:default";
      const target=p.id?S.data.agenda.items.find(i=>i.id===p.id):null;
      const main=el("div","rmain");
      main.append(el("div","t",`${opLabel(p)}：${p.text?p.text.slice(0,60):target?plainText(target):p.entity||""}`));
      const st=p.failed?"還沒寫到 Drive（重新讀取時再試）":p.state==="rejected"?`willy 拒絕：${p.reason||"（沒給原因）"}`:p.state==="conflict"?`兩邊都改了：${p.reason||"回電腦處理"}`:p.state==="retry"?"電腦稍後重試":"等電腦套用";
      main.append(el("div","who",`${localStamp(p.at)}・${st}`));
      { const a=el("div","acts one"); // 每筆都能移除：v13 前範例模式留下的舊殘留沒有 sample 標記，只能手動清（2026-10-26 演練）
        if(p.failed&&S.mcp) a.append(btn("再寫一次","small primary",async()=>{ try{ await call("create_file",{title:`${CHANGE_PREFIX}${p.at.replace(/[-:.]/g,"").slice(0,15)}-${p.cid}.json`,textContent:JSON.stringify(p,null,2),contentMimeType:"application/json",disableConversionToGoogleType:true}); delete p.failed; savePending(); toast("已寫到 Drive"); openPendingSheet(); }catch(e){ toast("還是失敗："+errText(e)); } }));
        a.append(btn("移除","small",()=>confirmSheet("移除這筆待記入？","只是手機不再顯示；變動檔若已在 Drive 不會刪。",()=>{S.pending=S.pending.filter(x=>x!==p); savePending(); render(); openPendingSheet();}))); main.append(a); }
      c.append(main); box.append(c); });
    if(S.pending.length) sh.append(box);
    const f=el("div","foot"); f.append(btn("關閉","",closeSheet)); sh.append(f);
  });
}
function localStamp(iso){ const d=new Date(iso); const z=n=>String(n).padStart(2,"0"); return isNaN(d)?iso:`${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`; } // 存的是 UTC，顯示本地（交貨測試 D-3）
let toastT=null;
// 做成了的（已打勾、已更新…）前面加個綠勾
function toast(msg){ let t=$(".toast"); if(!t){t=el("div","toast");t.setAttribute("role","status");document.body.append(t);}
  const ok=/^已/.test(msg); t.className="toast"+(ok?"":" plain"); t.innerHTML=ok?UI.check:""; t.append(msg); clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2600); }

// ---------- 寫回：只在 Drive 新增變動檔；範例模式只記在手機 ----------
async function queueChange(change,msg){
  // base_fp＝那一條的指紋（sync.py 用它判衝突，契約 G1）；base_file_fp 只是整檔版本，參考用
  const cid=uid("c-"); const target=change.id?S.data.agenda.items.find(i=>i.id===change.id):null;
  const body={schema:"willy-change/1",cid,...change,by:"手機",at:change.at||new Date().toISOString(),base_fp:target&&target.fp||null,base_file_fp:S.data.agenda.fp||null};
  if(body.op==="add") body.id=uid("tmp-");
  if(body.next_meeting) body.nm_id=uid("tmp-");
  if(S.sample) body.sample=true; // 範例上的操作不會寫到 Drive，讀到真資料時丟掉
  S.pending.push(body); savePending(); applyPending(body);
  render(); toast(msg);
  if(S.sample||!S.mcp) return;
  try{ await call("create_file",{title:`${CHANGE_PREFIX}${body.at.replace(/[-:.]/g,"").slice(0,15)}-${cid}.json`,textContent:JSON.stringify(body,null,2),contentMimeType:"application/json",disableConversionToGoogleType:true}); }
  catch(e){ toast("寫到 Drive 失敗："+errText(e)+"，先留在手機"); body.failed=true; savePending(); }
}

// ---------- 讀取：Drive → 失敗就範例 ----------
function errText(e){return e&&e.code?`${e.code}${e.message?"："+e.message:""}`:String(e&&e.message||e);}
async function call(tool,input){const r=await S.mcp.callTool(SERVER,tool,input,{cache:false});return r.payload!==undefined?r.payload:r;}
function findFiles(p){const out=[],seen=new Set();(function w(v){if(!v||typeof v!=="object")return;if(Array.isArray(v)){v.forEach(w);return;}
  if(typeof v.id==="string"&&(v.title||v.name)&&!seen.has(v.id)){seen.add(v.id);out.push({id:v.id,title:v.title||v.name});}Object.values(v).forEach(w);})(p);return out;}
function decode(p){const c=[];(function w(v){if(typeof v==="string")c.push(v);else if(v&&typeof v==="object")Object.values(v).forEach(w);})(p);c.sort((a,b)=>b.length-a.length);
  for(const s of c){try{return JSON.parse(s);}catch{}try{const bin=atob(s.replace(/\s/g,""));return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,ch=>ch.charCodeAt(0))));}catch{}}throw new Error("解不出內容");}
// 查詢不加 trashed 欄位：連接器不支援（2026-10-25 實測 tool_error）
async function readJson(title){const s=await call("search_files",{query:`title = '${title}'`,pageSize:3,excludeContentSnippets:true});const f=findFiles(s).find(x=>x.title===title);if(!f)return null;return decode(await call("download_file_content",{fileId:f.id}));}

async function load(manual,auto){
  const keep=auto&&!S.sample; // 自動重讀失敗不要把真資料換成範例，也不跳提示
  if(!S.mcp){ try{S.mcp=await window.claude?.use?.("mcp");}catch{S.mcp=null;} }
  if(!S.mcp){ S.sample=true; render(); if(manual) toast("這個檢視不能用連接器，顯示範例"); return; }
  try{
    const [agenda,status,clients]=await Promise.all([readJson(F_AGENDA),readJson(F_STATUS),readJson(F_CLIENTS)]);
    if(!agenda&&keep) return;
    if(!agenda){ S.sample=true; render(); if(manual) toast("Drive 上還沒有 willy-agenda.json，顯示範例"); return; }
    S.data={agenda,status:status||{applied:[],results:{},conflicts:[]},clients:clients||{clients:[]}};
    // status.results[cid]={state: applied|rejected|conflict|retry, reason, ids}（契約 G4）；applied 清掉，其餘留著並標原因
    const applied=new Set(S.data.status.applied||[]); const res=S.data.status.results||{};
    S.pending=S.pending.filter(p=>{const r=res[p.cid]; if(p.sample) return false; if(applied.has(p.cid)||(r&&r.state==="applied")) return false; if(r){p.state=r.state;p.reason=r.reason||"";} return true;}); savePending();
    S.pending.forEach(applyPending);
    S.sample=false; render(); if(manual) toast("已更新");
  }catch(e){ if(keep) return; S.sample=true; render(); toast("讀 Drive 失敗："+errText(e)); }
}

// 切分頁：記住每頁捲到哪，回來接著看，不每次硬跳回最上面（手機上一跳到頂，瀏覽器工具列會伸縮，底部列就跟著上下跳）；
// 再點一次目前這頁才捲回最上面
const tabScroll={};
document.querySelectorAll("nav.tabs button[data-tab]").forEach(b=>b.onclick=()=>{ const t=b.dataset.tab;
  if(t===S.tab){ window.scrollTo({top:0,behavior:motion()}); return; }
  tabScroll[S.tab]=window.scrollY; S.tab=t; render(); window.scrollTo({top:tabScroll[t]||0,behavior:"instant"}); });
$("#add").onclick=openAdd;
$("#refresh").onclick=async()=>{ const r=$("#refresh"); if(r.classList.contains("spin")) return; r.classList.add("spin"); try{ await load(true); } finally{ r.classList.remove("spin"); } };
const td=new Date(); $("#today").textContent=`${td.getMonth()+1} 月 ${td.getDate()} 日 週${WD[td.getDay()]}`;
S.data=sampleData(); S.pending.forEach(applyPending); render(); load(false);
// 自動重讀：切回頁面、開著每 5 分；抽屜開著或正在拖曳就等下一輪，不打斷操作
let lastLoad=Date.now(), hiddenAt=0, loading=false;
async function autoLoad(force){
  if(loading||document.hidden||sheetEl||document.querySelector(".dragging")) return;
  if(!force&&Date.now()-hiddenAt<60e3) return; // 離開超過 1 分才重讀（交貨測試 D-2）
  loading=true; try{ await load(false,true); } finally{ loading=false; lastLoad=Date.now(); }
}
document.addEventListener("visibilitychange",()=>{ if(document.hidden) hiddenAt=Date.now(); else autoLoad(false); });
setInterval(()=>autoLoad(true),5*60e3);
</script>
